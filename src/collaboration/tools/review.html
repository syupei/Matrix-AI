<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>成果审阅</title><style>*{box-sizing:border-box}input[type=file]{max-width:100%}pre{overflow-wrap:anywhere}body{max-width:48rem;margin:2rem auto;padding:1rem;font:17px/1.6 system-ui}pre{white-space:pre-wrap;background:#f3f4f6;padding:1rem}button{font:inherit;padding:.65rem;margin:.3rem}label{display:block;margin:1rem 0}textarea{width:100%;min-height:6rem}</style><h1>成果审阅</h1><p>导入任务提供的请求 JSON，核对成果和范围后选择并导出。请将回复文件回传原任务；此页面不会发送数据或自动批准。</p><input id="input" type="file" accept="application/json"><pre id="details">尚未导入请求</pre><label><input type="radio" name="choice" value="confirm">确认，可继续</label><label><input type="radio" name="choice" value="adjust">需要进行调整，进入调整对话</label><label>补充说明<textarea id="comment"></textarea></label><button id="save" disabled>导出回复</button><p id="status" role="status"></p><script>
let request=null;const $=id=>document.getElementById(id);
$('input').addEventListener('change',async event=>{request=null;$('save').disabled=true;document.querySelectorAll('[name=choice]').forEach(x=>x.checked=false);try{const r=JSON.parse(await event.target.files[0].text());if(!r.request_id||!r.artifact_sha256||!Array.isArray(r.scope)||!r.scope.length)throw Error('请求缺少标识、成果摘要或范围');request=r;$('details').textContent=JSON.stringify(r,null,2);$('status').textContent='请核对成果后选择。'}catch(e){$('details').textContent='无法导入';$('status').textContent=e.message}});
document.querySelectorAll('[name=choice]').forEach(x=>x.addEventListener('change',()=>{$('save').disabled=!request}));
$('save').addEventListener('click',()=>{const choice=document.querySelector('[name=choice]:checked');if(!request||!choice)return;const reply={request_id:request.request_id,scope:request.scope,artifact_sha256:request.artifact_sha256,actor:'user',choice:choice.value,comment:$('comment').value,submitted_at:new Date().toISOString()};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(reply,null,2)],{type:'application/json'}));a.href=url;a.download='review-response.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已导出，请回传原任务；尚未记录为收到。'});
</script></html>
